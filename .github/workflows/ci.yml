name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows is required: the test project also targets net48/net472, which only
    # execute on .NET Framework (Windows-only).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore LemonSqueezy.NET.slnx

      - name: Build
        run: dotnet build LemonSqueezy.NET.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LemonSqueezy.NET.slnx --configuration Release --no-build --verbosity normal
