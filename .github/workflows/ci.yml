name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows is required: the test project also targets net48/net472, which only
    # execute on .NET Framework (Windows-only).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Target the test project rather than the whole solution so the manual harness under
      # samples/ is excluded from CI. The test project references the library and targets
      # net10.0/net48/net472, so this still builds both library TFMs (net10.0 + netstandard2.0).
      - name: Restore
        run: dotnet restore tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj

      - name: Build
        run: dotnet build tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj --configuration Release --no-build --verbosity normal
