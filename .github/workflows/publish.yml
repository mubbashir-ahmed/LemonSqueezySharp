name: Publish

# Publishes LemonSqueezy.NET to NuGet.org using Trusted Publishing (OIDC) — no long-lived
# API key is stored in GitHub. The NuGet/login action exchanges the GitHub Actions OIDC
# token for a short-lived NuGet API key at push time.
#
# Triggers:
#   * Publishing a GitHub Release whose tag is the version (e.g. tag "v0.2.0") — this PUSHES.
#   * Manual run (workflow_dispatch) with an explicit version — always a DRY RUN: it builds,
#     tests, packs and uploads the .nupkg artifact, but never pushes.
#
# Prerequisites before a release can publish:
#   1. Create a Trusted Publishing policy on nuget.org for this repo + this workflow file,
#      scoped to the "LemonSqueezy.NET" package (Account -> Trusted Publishing).
#   2. Add a repository variable NUGET_USER with your nuget.org username (Settings ->
#      Secrets and variables -> Actions -> Variables).

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build (e.g. 0.2.0)'
        required: true

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing (OIDC token exchange)

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            $v = '${{ github.event.release.tag_name }}'.TrimStart('v')
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Could not resolve a version.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version $v"

      # Build/test the test project (not the whole solution) so the manual harness under
      # samples/ is excluded. It references the library, so the -p:Version global property
      # still flows to it and the Release output is what the Pack step reuses (--no-build).
      - name: Restore
        run: dotnet restore tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj

      - name: Build
        run: dotnet build tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/LemonSqueezy.NET.Tests/LemonSqueezy.NET.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack LemonSqueezy.NET.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet API key.
      # Only runs for real releases; manual dispatch stays a dry run (no login, no push).
      - name: NuGet login (Trusted Publishing)
        if: ${{ github.event_name == 'release' }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ github.event_name == 'release' }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
