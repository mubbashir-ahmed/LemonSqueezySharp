name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build (e.g. 0.2.0) — dry run only'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('ci-{0}', github.ref) || format('publish-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Resolve version
        id: version
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'release') { $v = $env:TAG_NAME.TrimStart('v') } else { $v = $env:INPUT_VERSION }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Could not resolve a version.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version $v"

      - name: Restore
        run: dotnet restore tests/LemonSqueezySharp.Tests/LemonSqueezySharp.Tests.csproj

      - name: Build
        run: >
          dotnet build tests/LemonSqueezySharp.Tests/LemonSqueezySharp.Tests.csproj
          --configuration Release --no-restore
          ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
              && format('-p:Version={0}', steps.version.outputs.version) || '' }}

      - name: Test
        run: dotnet test tests/LemonSqueezySharp.Tests/LemonSqueezySharp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: >
          dotnet pack LemonSqueezySharp.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts

      - name: Upload package artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      - name: NuGet login (Trusted Publishing)
        if: github.event_name == 'release'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: github.event_name == 'release'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Write-Host "Contents of artifacts:"
          Get-ChildItem artifacts | Format-Table Name, Length
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if (-not $packages) { throw 'No .nupkg files found in artifacts' }
          foreach ($p in $packages) {
            dotnet nuget push $p.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($p.Name)" }
          }
